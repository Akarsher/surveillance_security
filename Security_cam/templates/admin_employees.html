<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/styles.css">
    <title>Employee Management</title>
</head>
<body>
    <div class="container">
        <h1>Employee Management</h1>
        <button onclick="window.location.href='/admin/employee/form'">Add Employee</button>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Employee ID</th>
                    <th>Mobile Number</th>
                    <th>Authorization</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Loop through employees and display their details -->
                {% for employee in employees %}
                <tr>
                    <td>{{ employee.username }}</td>
                    <td>{{ employee.emp_id }}</td>
                    <td>{{ employee.mobile_number }}</td>
                    <td>{{ employee.authorization }}</td>
                    <td>{{ employee.role }}</td>
                    <td>
                        <button onclick="window.location.href='/admin/employee/edit/{{ employee.id }}'">Edit</button>
                        <button onclick="deleteEmployee({{ employee.id }})">Delete</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script src="/static/js/admin.js"></script>
</body>
</html>
