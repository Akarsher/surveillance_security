<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Dashboard</title>
  <link rel="stylesheet" href="/static/admin.css">
  <link rel="stylesheet" href="/static/pro-theme.css">
  <style>
    #editModal {
      display: none;
    }

    #editModal.active {
      display: flex;
    }
  </style>
</head>
<body class="employee-shell">
  <div class="container">
    <div class="employee-topbar">
      <div>
        <h1>Employee Dashboard</h1>
        <p class="subtitle" style="margin: 4px 0 0 0;">Welcome back, <span id="greetingName">Employee</span></p>
      </div>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <section class="section employee-hero">
      <h2 style="margin-top: 0;">Overview</h2>
      <div class="employee-stats">
        <div class="stat-card">
          <div class="label">Total Records</div>
          <div class="value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Today's Entries</div>
          <div class="value" id="statToday">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Last Seen</div>
          <div class="value" id="statLastSeen">-</div>
        </div>
      </div>
    </section>

    <div class="employee-grid">
      <section class="section">
        <h2 style="margin-top: 0;">Profile</h2>
        <div class="profile-pane">
          <img id="profileImage" src="" alt="Profile Picture" class="profile-image">
          <div class="profile-list">
            <div class="profile-item"><strong>Name</strong><span id="profileName"></span></div>
            <div class="profile-item"><strong>Username</strong><span id="profileUsername"></span></div>
            <div class="profile-item"><strong>Employee ID</strong><span id="profileEmpID"></span></div>
            <div class="profile-item"><strong>Role</strong><span id="profileRole"></span></div>
            <div class="profile-item"><strong>Mobile</strong><span id="profileMobile"></span></div>
          </div>
        </div>
        <div style="margin-top: 14px;">
          <button class="btn btn-primary" onclick="openEditModal()">Edit Profile</button>
        </div>
      </section>

      <section class="section">
        <h2 style="margin-top: 0;">Today's Access</h2>
        <div id="todaysEntry" class="entry-list">
          <div class="empty-state">No entries found for today.</div>
        </div>
      </section>
    </div>

    <section class="section">
      <h2 style="margin-top: 0;">Entry History</h2>
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>No. of People</th>
              <th>Names</th>
            </tr>
          </thead>
          <tbody id="previousEntries">
            <tr>
              <td colspan="4" style="text-align: center;">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Profile</h2>
        <button class="btn btn-secondary" type="button" onclick="closeEditModal()">Close</button>
      </div>
      <form id="editProfileForm" onsubmit="saveProfile(event)">
        <div class="form-group">
          <label for="editName">Name</label>
          <input type="text" id="editName" required>
        </div>
        <div class="form-group">
          <label for="editMobile">Mobile</label>
          <input type="text" id="editMobile">
        </div>
        <div class="form-group">
          <label for="editPassword">New Password</label>
          <input type="password" id="editPassword">
        </div>
        <div class="form-group">
          <label for="editImage">Profile Picture</label>
          <input type="file" id="editImage" accept="image/*">
        </div>
        <button type="submit" class="save-btn">Save Changes</button>
      </form>
    </div>
  </div>

  <script>
    async function loadEmployeeDashboard() {
      const employee = JSON.parse(sessionStorage.getItem('user'));
      if (!employee) {
        alert('No employee session found. Redirecting to login...');
        window.location.href = '/login?type=employee';
        return;
      }

      // Populate profile details
      document.getElementById('greetingName').textContent = employee.name || 'Employee';
      document.getElementById('profileName').textContent = employee.name || '-';
      document.getElementById('profileUsername').textContent = employee.username || '-';
      document.getElementById('profileEmpID').textContent = employee.emp_id || '-';
      document.getElementById('profileRole').textContent = employee.role || '-';
      document.getElementById('profileMobile').textContent = employee.mobile || 'N/A';

      // Display profile picture
      const profileImage = document.getElementById('profileImage');
      if (employee.image_path) {
        profileImage.src = '/' + employee.image_path;
      } else {
        profileImage.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(employee.name)}&background=3b82f6&color=fff`;
      }

      try {
        const today = new Date().toISOString().split('T')[0];
        const resToday = await fetch(`/employee/logs?employee_id=${employee.id}&start=${today}&end=${today}`);
        const todayLogs = await resToday.json();
        renderTodayEntries(todayLogs);

        const resPrevious = await fetch(`/employee/logs?employee_id=${employee.id}`);
        const logs = await resPrevious.json();
        renderHistory(logs);
        updateStats(logs, todayLogs);
      } catch (err) {
        console.error('Failed to load dashboard data', err);
        renderTodayEntries([]);
        renderHistory([]);
        updateStats([], []);
      }
    }

    function renderTodayEntries(entries) {
      const todaysEntry = document.getElementById('todaysEntry');
      if (!entries || entries.length === 0) {
        todaysEntry.innerHTML = `<div class="empty-state">No entries found for today.</div>`;
        return;
      }

      todaysEntry.innerHTML = entries.map(entry => `
        <div class="entry-chip">
          <div class="time">${entry.time}</div>
          <div class="names">${entry.names.join(', ')}</div>
        </div>
      `).join('');
    }

    function renderHistory(logs) {
      const previousEntries = document.getElementById('previousEntries');
      if (!logs || logs.length === 0) {
        previousEntries.innerHTML = `<tr><td colspan="4" style="text-align:center;">No history found.</td></tr>`;
        return;
      }

      previousEntries.innerHTML = '';
      logs.forEach(log => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${log.date}</td>
          <td>${log.time}</td>
          <td>${log.count}</td>
          <td>${log.names.join(', ')}</td>
        `;
        previousEntries.appendChild(row);
      });
    }

    function updateStats(logs, todayLogs) {
      document.getElementById('statTotal').textContent = logs.length;
      document.getElementById('statToday').textContent = todayLogs.length;
      document.getElementById('statLastSeen').textContent = logs.length > 0 ? `${logs[0].date} ${logs[0].time}` : '-';
    }

    function openEditModal() {
      const employee = JSON.parse(sessionStorage.getItem('user'));
      document.getElementById('editName').value = employee.name;
      document.getElementById('editMobile').value = employee.mobile || '';
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    async function saveProfile(event) {
      event.preventDefault();
      const employee = JSON.parse(sessionStorage.getItem('user'));
      const name = document.getElementById('editName').value;
      const mobile = document.getElementById('editMobile').value;
      const password = document.getElementById('editPassword').value;
      const imageFile = document.getElementById('editImage').files[0];

      const formData = new FormData();
      formData.append('id', employee.id);
      formData.append('name', name);
      formData.append('mobile', mobile);
      if (password) formData.append('password', password);
      if (imageFile) formData.append('image', imageFile);

      const res = await fetch(`/employee/update-profile`, {
        method: 'POST',
        body: formData
      });

      if (res.ok) {
        const updatedEmployee = await res.json();
        sessionStorage.setItem('user', JSON.stringify(updatedEmployee));
        closeEditModal();
        loadEmployeeDashboard();
        alert('Profile updated successfully!');
      } else {
        alert('Failed to update profile. Please try again.');
      }
    }

    function logout() {
      sessionStorage.clear(); // Clear session storage
      window.location.href = '/login?type=employee'; // Redirect to login page
    }

    loadEmployeeDashboard();
  </script>
</body>
</html>
