<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    .header {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .header h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    .logout-btn {
      padding: 10px 15px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.3s;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .container {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      margin-top: 20px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .profile-details, .entry-log {
      background: rgba(15, 23, 42, 0.8);
      padding: 15px;
      border-radius: 8px;
    }

    .profile-details div, .entry-log div {
      margin-bottom: 10px;
    }

    .entry-log table {
      width: 100%;
      border-collapse: collapse;
    }

    .entry-log th, .entry-log td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .entry-log th {
      background: rgba(59, 130, 246, 0.2);
    }

    .entry-log tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .edit-btn {
      padding: 10px 15px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.3s;
    }

    .edit-btn:hover {
      background: #2563eb;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: rgba(30, 41, 59, 0.9);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #94a3b8;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.8);
      color: white;
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .save-btn {
      width: 100%;
      padding: 10px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.3s;
    }

    .save-btn:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>Employee Dashboard</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- Main Container -->
  <div class="container">
    <!-- Profile Section -->
    <div class="profile-section">
      <h2>Your Profile</h2>
      <div class="profile-details">
        <div style="text-align: center; margin-bottom: 20px;">
          <img id="profileImage" src="" alt="Profile Picture" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #3b82f6;">
        </div>
        <div><strong>Name:</strong> <span id="profileName"></span></div>
        <div><strong>Username:</strong> <span id="profileUsername"></span></div>
        <div><strong>Employee ID:</strong> <span id="profileEmpID"></span></div>
        <div><strong>Role:</strong> <span id="profileRole"></span></div>
        <div><strong>Mobile:</strong> <span id="profileMobile"></span></div>
      </div>
      <button class="edit-btn" onclick="openEditModal()">Edit Profile</button>
    </div>

    <!-- Today's Entry Section -->
    <div class="entry-section">
      <h2>Today's Entry</h2>
      <div class="entry-log" id="todaysEntry">
        <div>No entries found for today.</div>
      </div>
    </div>

    <!-- Previous Entries Section -->
    <div class="entry-section">
      <h2>Previous Entries</h2>
      <div class="entry-log">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>No. of People</th>
              <th>Names</th>
            </tr>
          </thead>
          <tbody id="previousEntries">
            <tr>
              <td colspan="4" style="text-align: center;">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Profile</h2>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="editProfileForm" onsubmit="saveProfile(event)">
        <div class="form-group">
          <label for="editName">Name</label>
          <input type="text" id="editName" required>
        </div>
        <div class="form-group">
          <label for="editMobile">Mobile</label>
          <input type="text" id="editMobile">
        </div>
        <div class="form-group">
          <label for="editPassword">New Password</label>
          <input type="password" id="editPassword">
        </div>
        <div class="form-group">
          <label for="editImage">Profile Picture</label>
          <input type="file" id="editImage" accept="image/*">
        </div>
        <button type="submit" class="save-btn">Save Changes</button>
      </form>
    </div>
  </div>

  <script>
    async function loadEmployeeDashboard() {
      const employee = JSON.parse(sessionStorage.getItem('user'));
      if (!employee) {
        alert('No employee session found. Redirecting to login...');
        window.location.href = '/login?type=employee';
        return;
      }

      // Populate profile details
      document.getElementById('profileName').textContent = employee.name;
      document.getElementById('profileUsername').textContent = employee.username;
      document.getElementById('profileEmpID').textContent = employee.emp_id; // Correct Employee ID
      document.getElementById('profileRole').textContent = employee.role;
      document.getElementById('profileMobile').textContent = employee.mobile || 'N/A';

      // Display profile picture
      const profileImage = document.getElementById('profileImage');
      if (employee.image_path) {
        profileImage.src = '/' + employee.image_path; // Use the image path from the backend
      } else {
        profileImage.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(employee.name)}&background=3b82f6&color=fff`;
      }

      // Load today's entry
      const today = new Date().toISOString().split('T')[0];
      const resToday = await fetch(`/employee/logs?employee_id=${employee.id}&start=${today}&end=${today}`);
      const todaysEntry = document.getElementById('todaysEntry');
      const todayLogs = await resToday.json();
      if (todayLogs.length > 0) {
        todaysEntry.innerHTML = `<div>${todayLogs[0].time} - ${todayLogs[0].names.join(', ')}</div>`;
      }

      // Load previous entries
      const resPrevious = await fetch(`/employee/logs?employee_id=${employee.id}`);
      const previousEntries = document.getElementById('previousEntries');
      const logs = await resPrevious.json();
      previousEntries.innerHTML = '';
      logs.forEach(log => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${log.date}</td>
          <td>${log.time}</td>
          <td>${log.count}</td>
          <td>${log.names.join(', ')}</td>
        `;
        previousEntries.appendChild(row);
      });
    }

    function openEditModal() {
      const employee = JSON.parse(sessionStorage.getItem('user'));
      document.getElementById('editName').value = employee.name;
      document.getElementById('editMobile').value = employee.mobile || '';
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    async function saveProfile(event) {
      event.preventDefault();
      const employee = JSON.parse(sessionStorage.getItem('user'));
      const name = document.getElementById('editName').value;
      const mobile = document.getElementById('editMobile').value;
      const password = document.getElementById('editPassword').value;
      const imageFile = document.getElementById('editImage').files[0];

      const formData = new FormData();
      formData.append('id', employee.id);
      formData.append('name', name);
      formData.append('mobile', mobile);
      if (password) formData.append('password', password);
      if (imageFile) formData.append('image', imageFile);

      const res = await fetch(`/employee/update-profile`, {
        method: 'POST',
        body: formData
      });

      if (res.ok) {
        alert('Profile updated successfully!');
        const updatedEmployee = await res.json();
        sessionStorage.setItem('user', JSON.stringify(updatedEmployee));
        closeEditModal();
        loadEmployeeDashboard();
      } else {
        alert('Failed to update profile. Please try again.');
      }
    }

    function logout() {
      sessionStorage.clear(); // Clear session storage
      window.location.href = '/login?type=employee'; // Redirect to login page
    }

    loadEmployeeDashboard();
  </script>
</body>
</html>
