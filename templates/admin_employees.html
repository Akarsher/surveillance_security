<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management - Security System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #e2e8f0;
    }
    
    /* Header */
    .header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header h1 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .header-actions {
      display: flex;
      gap: 12px;
    }
    
    /* Main Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    
    /* Stats Cards */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .stat-card {
      background: rgba(30, 41, 59, 0.8);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .stat-card .label {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 8px;
    }
    
    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
    }
    
    .stat-card.authorized .value { color: #10b981; }
    .stat-card.restricted .value { color: #f59e0b; }
    .stat-card.total .value { color: #3b82f6; }
    .stat-card.inactive .value { color: #6b7280; }
    
    /* Action Bar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .search-box {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .search-box input, .search-box select {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 10px 16px;
      color: #e2e8f0;
      font-size: 0.95rem;
    }
    
    .search-box input:focus, .search-box select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    
    /* Buttons */
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }
    
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
    
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }
    
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    
    .btn-secondary {
      background: rgba(100, 116, 139, 0.3);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .btn-sm {
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    
    /* Employee Grid */
    .employee-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    
    .employee-card {
      background: rgba(30, 41, 59, 0.8);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      transition: all 0.3s;
    }
    
    .employee-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
      border-color: rgba(59,130,246,0.5);
    }
    
    .employee-card.inactive {
      opacity: 0.6;
    }
    
    .card-header {
      display: flex;
      align-items: center;
      padding: 20px;
      gap: 16px;
      background: rgba(0,0,0,0.2);
    }
    
    .employee-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #3b82f6;
    }
    
    .employee-photo.authorized { border-color: #10b981; }
    .employee-photo.restricted { border-color: #f59e0b; }
    
    .employee-info h3 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }
    
    .employee-info .emp-id {
      color: #94a3b8;
      font-size: 0.85rem;
      font-family: monospace;
    }
    
    .employee-info .designation {
      color: #60a5fa;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    
    .role-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .role-badge.authorized {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    
    .role-badge.restricted {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }
    
    .card-body {
      padding: 20px;
    }
    
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .detail-row:last-child {
      border-bottom: none;
    }
    
    .detail-label {
      color: #94a3b8;
      font-size: 0.85rem;
    }
    
    .detail-value {
      color: #e2e8f0;
      font-size: 0.9rem;
    }
    
    .card-actions {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      background: rgba(0,0,0,0.2);
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    
    .card-actions .btn {
      flex: 1;
      justify-content: center;
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: #1e293b;
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .modal-header h2 {
      font-size: 1.3rem;
    }
    
    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }
    
    .modal-body {
      padding: 24px;
    }
    
    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .form-group.full-width {
      grid-column: span 2;
    }
    
    .form-group label {
      font-size: 0.9rem;
      color: #94a3b8;
      font-weight: 500;
    }
    
    .form-group label .required {
      color: #ef4444;
    }
    
    .form-group input,
    .form-group select {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 12px 16px;
      color: #e2e8f0;
      font-size: 1rem;
    }
    
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    
    .form-group input::placeholder {
      color: #64748b;
    }
    
    /* Photo Upload */
    .photo-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px;
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .photo-upload:hover {
      border-color: #3b82f6;
      background: rgba(59,130,246,0.05);
    }
    
    .photo-upload input {
      display: none;
    }
    
    .photo-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #3b82f6;
    }
    
    .photo-placeholder {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(59,130,246,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #3b82f6;
    }
    
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 20px 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 16px 24px;
      border-radius: 12px;
      color: white;
      font-weight: 500;
      z-index: 2000;
      animation: slideIn 0.3s ease;
    }
    
    .toast.success { background: linear-gradient(135deg, #10b981, #059669); }
    .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }
    
    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      
      .form-group.full-width {
        grid-column: span 1;
      }
      
      .employee-grid {
        grid-template-columns: 1fr;
      }
      
      .header {
        flex-direction: column;
        gap: 16px;
      }
      
      .action-bar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
  <link rel="stylesheet" href="/static/pro-theme.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>👥 Employee Management</h1>
    <div class="header-actions">
      <a href="/admin" class="btn btn-secondary">← Dashboard</a>
      <button class="btn btn-primary" onclick="openAddModal()">➕ Add Employee</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card total">
        <div class="label">Total Employees</div>
        <div class="value" id="statTotal">0</div>
      </div>
      <div class="stat-card authorized">
        <div class="label">Authorized</div>
        <div class="value" id="statAuthorized">0</div>
      </div>
      <div class="stat-card restricted">
        <div class="label">Restricted</div>
        <div class="value" id="statRestricted">0</div>
      </div>
      <div class="stat-card inactive">
        <div class="label">Inactive</div>
        <div class="value" id="statInactive">0</div>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search by name, ID, or department..." style="min-width: 280px;">
        <select id="filterRole">
          <option value="">All Roles</option>
          <option value="authorized">Authorized</option>
          <option value="restricted">Restricted</option>
        </select>
        <select id="filterDepartment">
          <option value="">All Departments</option>
        </select>
      </div>
      <button class="btn btn-secondary" onclick="loadEmployees()">🔄 Refresh</button>
    </div>

    <!-- Employee Grid -->
    <div class="employee-grid" id="employeeGrid">
      <div class="empty-state">
        <div class="icon">👥</div>
        <h3>Loading employees...</h3>
      </div>
    </div>
  </div>

  <!-- Add/Edit Employee Modal -->
  <div class="modal" id="employeeModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Employee</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="employeeForm">
          <input type="hidden" id="editMode" value="add">
          <input type="hidden" id="originalEmpId" value="">
          
          <!-- Photo Upload -->
          <div class="form-group full-width">
            <label>Photo <span class="required">*</span></label>
            <label class="photo-upload" id="photoUpload">
              <div class="photo-placeholder" id="photoPlaceholder">📷</div>
              <img src="" alt="Preview" class="photo-preview" id="photoPreview" style="display:none;">
              <span>Click to upload photo</span>
              <input type="file" id="photoInput" accept="image/*">
            </label>
          </div>

          <div class="form-grid">
            <!-- Basic Info -->
            <div class="form-group">
              <label>Full Name <span class="required">*</span></label>
              <input type="text" id="empName" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
              <label>Employee ID <span class="required">*</span></label>
              <div style="display:flex; gap:8px;">
                <input type="text" id="empId" placeholder="EMP001" required style="flex:1;">
                <button type="button" class="btn btn-secondary btn-sm" onclick="generateEmpId()">Generate</button>
              </div>
            </div>
            
            <div class="form-group">
              <label>Username <span class="required">*</span></label>
              <input type="text" id="empUsername" placeholder="johndoe" required>
            </div>
            
            <div class="form-group">
              <label>Password <span class="required" id="passwordRequired">*</span></label>
              <input type="password" id="empPassword" placeholder="••••••••" minlength="6">
              <small style="color:#64748b;" id="passwordHint">Min 6 characters</small>
            </div>
            
            <!-- Contact -->
            <div class="form-group">
              <label>Mobile Number</label>
              <input type="tel" id="empMobile" placeholder="+91 98765 43210">
            </div>
            
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="empEmail" placeholder="john@company.com">
            </div>
            
            <!-- Role & Designation -->
            <div class="form-group">
              <label>Authorization <span class="required">*</span></label>
              <select id="empRole" required>
                <option value="authorized">✅ Authorized</option>
                <option value="restricted">⚠️ Restricted</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Designation</label>
              <input type="text" id="empDesignation" placeholder="Software Engineer" list="designationList">
              <datalist id="designationList"></datalist>
            </div>
            
            <div class="form-group">
              <label>Department</label>
              <input type="text" id="empDepartment" placeholder="Engineering" list="departmentList">
              <datalist id="departmentList"></datalist>
            </div>
            
            <div class="form-group" id="statusGroup" style="display:none;">
              <label>Status</label>
              <select id="empStatus">
                <option value="1">Active</option>
                <option value="0">Inactive</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-success" onclick="saveEmployee()">💾 Save Employee</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal" id="deleteModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h2>⚠️ Confirm Delete</h2>
        <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body" style="text-align:center;">
        <p>Are you sure you want to delete employee:</p>
        <p style="font-size:1.2rem; font-weight:600; margin:16px 0;" id="deleteEmpName"></p>
        <p style="color:#94a3b8;">This action cannot be undone.</p>
      </div>
      <div class="modal-footer" style="justify-content:center;">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDelete()">🗑️ Delete</button>
      </div>
    </div>
  </div>

  <script>
    let employees = [];
    let deleteEmpId = null;

    // =============================
    // LOAD DATA
    // =============================
    async function loadEmployees() {
      try {
        const res = await fetch('/admin/employees/list');
        employees = await res.json();
        renderEmployees();
        updateStats();
        loadFilters();
      } catch (e) {
        showToast('Failed to load employees', false);
      }
    }

    function renderEmployees() {
      const grid = document.getElementById('employeeGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const roleFilter = document.getElementById('filterRole').value;
      const deptFilter = document.getElementById('filterDepartment').value;

      let filtered = employees.filter(emp => {
        const matchSearch = !search || 
          (emp.name && emp.name.toLowerCase().includes(search)) ||
          (emp.emp_id && emp.emp_id.toLowerCase().includes(search)) ||
          (emp.department && emp.department.toLowerCase().includes(search)) ||
          (emp.designation && emp.designation.toLowerCase().includes(search));
        const matchRole = !roleFilter || emp.role === roleFilter;
        const matchDept = !deptFilter || emp.department === deptFilter;
        return matchSearch && matchRole && matchDept;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: span 3;">
            <div class="icon">🔍</div>
            <h3>No employees found</h3>
            <p>Try adjusting your search or filters</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(emp => {
        // Ensure emp_id exists and is valid
        const empId = emp.emp_id || '';
        const empName = emp.name || 'Unknown';
        const imgPath = emp.image_path ? '/' + emp.image_path : '';
        const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(empName)}&background=3b82f6&color=fff`;
        
        return `
          <div class="employee-card ${emp.is_active ? '' : 'inactive'}">
            <div class="card-header">
              <img src="${imgPath || fallbackImg}" 
                   alt="${empName}" 
                   class="employee-photo ${emp.role || 'authorized'}"
                   onerror="this.src='${fallbackImg}'">
              <div class="employee-info">
                <h3>${empName}</h3>
                <div class="emp-id">${empId}</div>
                <div class="designation">${emp.designation || 'No designation'}</div>
              </div>
              <span class="role-badge ${emp.role || 'authorized'}">${emp.role || 'authorized'}</span>
            </div>
            <div class="card-body">
              <div class="detail-row">
                <span class="detail-label">Username</span>
                <span class="detail-value">@${emp.username || '—'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Department</span>
                <span class="detail-value">${emp.department || '—'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Mobile</span>
                <span class="detail-value">${emp.mobile || '—'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Email</span>
                <span class="detail-value">${emp.email || '—'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value">${emp.is_active ? '🟢 Active' : '🔴 Inactive'}</span>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn btn-secondary btn-sm" onclick="editEmployee('${empId}')">✏️ Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteEmployee('${empId}', '${empName.replace(/'/g, "\\'")}')">🗑️ Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateStats() {
      const total = employees.length;
      const authorized = employees.filter(e => e.role === 'authorized').length;
      const restricted = employees.filter(e => e.role === 'restricted').length;
      const inactive = employees.filter(e => !e.is_active).length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statAuthorized').textContent = authorized;
      document.getElementById('statRestricted').textContent = restricted;
      document.getElementById('statInactive').textContent = inactive;
    }

    function loadFilters() {
      const departments = [...new Set(employees.map(e => e.department).filter(Boolean))];
      const deptSelect = document.getElementById('filterDepartment');
      deptSelect.innerHTML = '<option value="">All Departments</option>' +
        departments.map(d => `<option value="${d}">${d}</option>`).join('');

      // Also populate datalists for form
      const deptList = document.getElementById('departmentList');
      deptList.innerHTML = departments.map(d => `<option value="${d}">`).join('');

      const designations = [...new Set(employees.map(e => e.designation).filter(Boolean))];
      const desList = document.getElementById('designationList');
      desList.innerHTML = designations.map(d => `<option value="${d}">`).join('');
    }

    // =============================
    // MODAL FUNCTIONS
    // =============================
    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add New Employee';
      document.getElementById('editMode').value = 'add';
      document.getElementById('originalEmpId').value = '';
      document.getElementById('employeeForm').reset();
      document.getElementById('photoPreview').style.display = 'none';
      document.getElementById('photoPlaceholder').style.display = 'flex';
      document.getElementById('statusGroup').style.display = 'none';
      document.getElementById('empPassword').required = true;
      document.getElementById('passwordRequired').style.display = 'inline';
      document.getElementById('passwordHint').textContent = 'Min 6 characters';
      document.getElementById('employeeModal').classList.add('active');
    }

    function editEmployee(empId) {
      // Validate empId
      if (!empId || empId === 'undefined' || empId === 'null') {
        showToast('Invalid employee ID', false);
        return;
      }

      const emp = employees.find(e => e.emp_id === empId);
      if (!emp) {
        showToast('Employee not found', false);
        return;
      }

      document.getElementById('modalTitle').textContent = 'Edit Employee';
      document.getElementById('editMode').value = 'edit';
      document.getElementById('originalEmpId').value = emp.emp_id;

      // Fill form
      document.getElementById('empName').value = emp.name || '';
      document.getElementById('empId').value = emp.emp_id || '';
      document.getElementById('empUsername').value = emp.username || '';
      document.getElementById('empPassword').value = '';
      document.getElementById('empMobile').value = emp.mobile || '';
      document.getElementById('empEmail').value = emp.email || '';
      document.getElementById('empRole').value = emp.role || 'authorized';
      document.getElementById('empDesignation').value = emp.designation || '';
      document.getElementById('empDepartment').value = emp.department || '';
      document.getElementById('empStatus').value = emp.is_active ? '1' : '0';

      // Show status field in edit mode
      document.getElementById('statusGroup').style.display = 'block';

      // Password not required in edit mode
      document.getElementById('empPassword').required = false;
      document.getElementById('passwordRequired').style.display = 'none';
      document.getElementById('passwordHint').textContent = 'Leave blank to keep current password';

      // Show current photo
      if (emp.image_path) {
        document.getElementById('photoPreview').src = '/' + emp.image_path;
        document.getElementById('photoPreview').style.display = 'block';
        document.getElementById('photoPlaceholder').style.display = 'none';
      } else {
        document.getElementById('photoPreview').style.display = 'none';
        document.getElementById('photoPlaceholder').style.display = 'flex';
      }

      document.getElementById('employeeModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('employeeModal').classList.remove('active');
    }

    // =============================
    // PHOTO HANDLING
    // =============================
    document.getElementById('photoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('photoPreview').src = e.target.result;
          document.getElementById('photoPreview').style.display = 'block';
          document.getElementById('photoPlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    });

    // =============================
    // GENERATE EMPLOYEE ID
    // =============================
    async function generateEmpId() {
      try {
        const res = await fetch('/admin/employee/generate-id');
        const data = await res.json();
        document.getElementById('empId').value = data.emp_id;
      } catch (e) {
        showToast('Failed to generate ID', false);
      }
    }

    // =============================
    // SAVE EMPLOYEE
    // =============================
    async function saveEmployee() {
      const editMode = document.getElementById('editMode').value;
      const originalEmpId = document.getElementById('originalEmpId').value;

      const name = document.getElementById('empName').value.trim();
      const empId = document.getElementById('empId').value.trim();
      const username = document.getElementById('empUsername').value.trim();
      const password = document.getElementById('empPassword').value;
      const mobile = document.getElementById('empMobile').value.trim();
      const email = document.getElementById('empEmail').value.trim();
      const role = document.getElementById('empRole').value;
      const designation = document.getElementById('empDesignation').value.trim();
      const department = document.getElementById('empDepartment').value.trim();
      const photoInput = document.getElementById('photoInput');

      // Validation
      if (!name || !empId || !username) {
        showToast('Please fill all required fields', false);
        return;
      }

      if (editMode === 'add' && !password) {
        showToast('Password is required for new employees', false);
        return;
      }

      if (password && password.length < 6) {
        showToast('Password must be at least 6 characters', false);
        return;
      }

      if (editMode === 'add' && !photoInput.files[0]) {
        showToast('Please upload a photo', false);
        return;
      }

      const formData = new FormData();
      formData.append('name', name);
      formData.append('emp_id', empId);
      formData.append('username', username);
      if (password) formData.append('password', password);
      formData.append('mobile', mobile);
      formData.append('email', email);
      formData.append('role', role);
      formData.append('designation', designation);
      formData.append('department', department);

      if (photoInput.files[0]) {
        formData.append('image', photoInput.files[0]);
      }

      try {
        let res;
        if (editMode === 'add') {
          res = await fetch('/admin/employee/add', {
            method: 'POST',
            body: formData
          });
        } else {
          formData.append('new_emp_id', empId);
          formData.append('is_active', document.getElementById('empStatus').value);
          res = await fetch(`/admin/employee/${originalEmpId}`, {
            method: 'PUT',
            body: formData
          });
        }

        const data = await res.json();

        if (res.ok) {
          showToast(data.message || 'Employee saved successfully', true);
          closeModal();
          loadEmployees();
        } else {
          showToast(data.detail || 'Failed to save employee', false);
        }
      } catch (e) {
        showToast('Error saving employee: ' + e.message, false);
      }
    }

    // =============================
    // DELETE EMPLOYEE
    // =============================
    function deleteEmployee(empId, name) {
      deleteEmpId = empId;
      document.getElementById('deleteEmpName').textContent = name;
      document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('active');
      deleteEmpId = null;
    }

    async function confirmDelete() {
      if (!deleteEmpId) return;

      try {
        const res = await fetch(`/admin/employee/${deleteEmpId}`, {
          method: 'DELETE'
        });

        const data = await res.json();

        if (res.ok) {
          showToast('Employee deleted successfully', true);
          closeDeleteModal();
          loadEmployees();
        } else {
          showToast(data.detail || 'Failed to delete employee', false);
        }
      } catch (e) {
        showToast('Error deleting employee', false);
      }
    }

    // =============================
    // SEARCH & FILTER
    // =============================
    document.getElementById('searchInput').addEventListener('input', renderEmployees);
    document.getElementById('filterRole').addEventListener('change', renderEmployees);
    document.getElementById('filterDepartment').addEventListener('change', renderEmployees);

    // =============================
    // TOAST
    // =============================
    function showToast(message, success = true) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = `toast ${success ? 'success' : 'error'}`;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => toast.remove(), 4000);
    }

    // =============================
    // INIT
    // =============================
    loadEmployees();
  </script>
</body>
</html>
