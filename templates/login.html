<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Security System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    
    .login-card {
      background: rgba(30, 41, 59, 0.9);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    
    .login-header {
      text-align: center;
      padding: 40px 30px 30px;
      background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(147,51,234,0.2));
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .logo {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    
    .login-header h1 {
      color: #f1f5f9;
      font-size: 1.75rem;
      margin-bottom: 8px;
    }
    
    .login-header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    
    .login-body {
      padding: 30px;
    }
    
    /* Tab Switcher */
    .tab-switcher {
      display: flex;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }
    
    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .tab-btn.active {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      box-shadow: 0 4px 12px rgba(59,130,246,0.4);
    }
    
    .tab-btn:not(.active):hover {
      background: rgba(255,255,255,0.05);
      color: #e2e8f0;
    }
    
    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    .input-wrapper {
      position: relative;
    }
    
    .input-wrapper .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: 0.6;
    }
    
    .form-group input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #f1f5f9;
      font-size: 1rem;
      transition: all 0.3s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    
    .form-group input::placeholder {
      color: #64748b;
    }
    
    .btn-login {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .btn-login.admin {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }
    
    .btn-login.employee {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    /* Face Login */
    .face-login-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    
    .divider span {
      color: #64748b;
      font-size: 0.85rem;
    }
    
    .btn-face-login {
      width: 100%;
      padding: 14px;
      border: 2px dashed rgba(147,51,234,0.5);
      border-radius: 12px;
      background: rgba(147,51,234,0.1);
      color: #a78bfa;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .btn-face-login:hover {
      background: rgba(147,51,234,0.2);
      border-color: #a78bfa;
    }
    
    /* Error Message */
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }
    
    .error-msg.show {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* Success Message */
    .success-msg {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }
    
    .success-msg.show {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* Face Login Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .modal-header h2 {
      color: #f1f5f9;
      font-size: 1.25rem;
    }
    
    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }
    
    .modal-body {
      padding: 24px;
    }
    
    .camera-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    
    .camera-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .camera-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border: 3px solid rgba(147,51,234,0.5);
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    }
    
    .camera-overlay.scanning {
      border-color: #a78bfa;
      animation: pulse 1.5s infinite;
    }
    
    .camera-overlay.success {
      border-color: #10b981;
    }
    
    .camera-overlay.error {
      border-color: #ef4444;
    }
    
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
    }
    
    .camera-status {
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
    }
    
    .camera-status.success { color: #10b981; }
    .camera-status.error { color: #ef4444; }
    
    .btn-capture {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .btn-capture:hover {
      transform: translateY(-2px);
    }
    
    .btn-capture:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    /* Footer */
    .login-footer {
      text-align: center;
      padding: 20px 30px 30px;
      color: #64748b;
      font-size: 0.85rem;
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      .login-header {
        padding: 30px 20px 24px;
      }
      
      .login-body {
        padding: 24px 20px;
      }
      
      .tab-btn {
        padding: 10px 12px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">🔐</div>
        <h1>Security System</h1>
        <p>Sign in to continue</p>
      </div>
      
      <div class="login-body">
        <!-- Tab Switcher -->
        <div class="tab-switcher">
          <button class="tab-btn active" onclick="switchTab('admin')" id="tabAdmin">
            🛡️ Admin
          </button>
          <button class="tab-btn" onclick="switchTab('employee')" id="tabEmployee">
            👤 Employee
          </button>
        </div>
        
        <!-- Error/Success Messages -->
        <div class="error-msg" id="errorMsg">
          <span>⚠️</span>
          <span id="errorText"></span>
        </div>
        
        <div class="success-msg" id="successMsg">
          <span>✅</span>
          <span id="successText"></span>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label id="usernameLabel">Username</label>
            <div class="input-wrapper">
              <span class="icon">👤</span>
              <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
            </div>
          </div>
          
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <span class="icon">🔒</span>
              <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
          </div>
          
          <button type="submit" class="btn-login admin" id="btnLogin">
            <span>🚀</span>
            <span id="btnText">Sign In as Admin</span>
          </button>
        </form>
        
        <!-- Face Login (Employee Only) -->
        <div class="face-login-section" id="faceLoginSection" style="display: none;">
          <div class="divider">
            <span>or sign in with</span>
          </div>
          <button class="btn-face-login" onclick="openFaceLogin()">
            <span>📷</span>
            <span>Face Recognition</span>
          </button>
        </div>
      </div>
      
      <div class="login-footer">
        🔒 Secure Access Control System
      </div>
    </div>
  </div>
  
  <!-- Face Login Modal -->
  <div class="modal" id="faceModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📷 Face Recognition Login</h2>
        <button class="modal-close" onclick="closeFaceModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="camera-container">
          <video id="faceVideo" autoplay playsinline muted></video>
          <div class="camera-overlay" id="cameraOverlay"></div>
        </div>
        <p class="camera-status" id="cameraStatus">Position your face in the circle</p>
        <canvas id="faceCanvas" style="display:none;"></canvas>
        <button class="btn-capture" id="btnCapture" onclick="captureFace()">
          <span>📸</span>
          <span>Capture & Login</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'admin';
    let faceStream = null;
    
    // =============================
    // TAB SWITCHING
    // =============================
    function switchTab(tab) {
      currentTab = tab;
      
      // Update tab buttons
      document.getElementById('tabAdmin').classList.toggle('active', tab === 'admin');
      document.getElementById('tabEmployee').classList.toggle('active', tab === 'employee');
      
      // Update form
      const btnLogin = document.getElementById('btnLogin');
      const btnText = document.getElementById('btnText');
      const usernameLabel = document.getElementById('usernameLabel');
      const faceSection = document.getElementById('faceLoginSection');
      
      if (tab === 'admin') {
        btnLogin.className = 'btn-login admin';
        btnText.textContent = 'Sign In as Admin';
        usernameLabel.textContent = 'Username';
        document.getElementById('username').placeholder = 'Enter admin username';
        faceSection.style.display = 'none';
      } else {
        btnLogin.className = 'btn-login employee';
        btnText.textContent = 'Sign In as Employee';
        usernameLabel.textContent = 'Username or Employee ID';
        document.getElementById('username').placeholder = 'Enter username or Emp ID';
        faceSection.style.display = 'block';
      }
      
      // Clear messages
      hideMessages();
    }
    
    // =============================
    // LOGIN HANDLER
    // =============================
    async function handleLogin(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const btnText = document.getElementById('btnText');
      
      hideMessages();
      btn.disabled = true;
      btnText.textContent = 'Signing in...';
      
      try {
        const endpoint = currentTab === 'admin' ? '/auth/admin/login' : '/auth/employee/login';
        
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (res.ok && data.status === 'success') {
          showSuccess(data.message || 'Login successful! Redirecting...');
          
          // Store session info
          if (data.user) {
            sessionStorage.setItem('user', JSON.stringify(data.user));
          }
          
          // Redirect
          setTimeout(() => {
            window.location.href = data.redirect || (currentTab === 'admin' ? '/admin' : '/employee');
          }, 1000);
        } else {
          showError(data.message || 'Invalid credentials');
        }
      } catch (err) {
        showError('Connection error. Please try again.');
      }
      
      btn.disabled = false;
      btnText.textContent = currentTab === 'admin' ? 'Sign In as Admin' : 'Sign In as Employee';
    }
    
    // =============================
    // FACE LOGIN
    // =============================
    async function openFaceLogin() {
      const modal = document.getElementById('faceModal');
      const video = document.getElementById('faceVideo');
      const overlay = document.getElementById('cameraOverlay');
      const status = document.getElementById('cameraStatus');
      
      modal.classList.add('active');
      overlay.className = 'camera-overlay';
      status.className = 'camera-status';
      status.textContent = 'Starting camera...';
      
      try {
        faceStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: 640, height: 480 } 
        });
        video.srcObject = faceStream;
        status.textContent = 'Position your face in the circle';
      } catch (err) {
        status.textContent = 'Camera access denied';
        status.className = 'camera-status error';
      }
    }
    
    function closeFaceModal() {
      const modal = document.getElementById('faceModal');
      modal.classList.remove('active');
      
      if (faceStream) {
        faceStream.getTracks().forEach(track => track.stop());
        faceStream = null;
      }
    }
    
    async function captureFace() {
      const video = document.getElementById('faceVideo');
      const canvas = document.getElementById('faceCanvas');
      const overlay = document.getElementById('cameraOverlay');
      const status = document.getElementById('cameraStatus');
      const btn = document.getElementById('btnCapture');
      
      // Capture frame
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      
      overlay.className = 'camera-overlay scanning';
      status.textContent = 'Recognizing face...';
      btn.disabled = true;
      
      try {
        // Convert canvas to blob
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
        
        const formData = new FormData();
        formData.append('image', blob, 'face.jpg');
        
        const res = await fetch('/auth/face-login', {
          method: 'POST',
          body: formData
        });
        
        const data = await res.json();
        
        if (res.ok && data.status === 'success') {
          overlay.className = 'camera-overlay success';
          status.className = 'camera-status success';
          status.textContent = `Welcome, ${data.user.name}!`;
          
          sessionStorage.setItem('user', JSON.stringify(data.user));
          
          setTimeout(() => {
            closeFaceModal();
            window.location.href = data.redirect || '/employee';
          }, 1500);
        } else {
          overlay.className = 'camera-overlay error';
          status.className = 'camera-status error';
          status.textContent = data.message || 'Face not recognized';
          btn.disabled = false;
        }
      } catch (err) {
        overlay.className = 'camera-overlay error';
        status.className = 'camera-status error';
        status.textContent = 'Error processing face';
        btn.disabled = false;
      }
    }
    
    // =============================
    // HELPERS
    // =============================
    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
    }
    
    function showSuccess(msg) {
      document.getElementById('successText').textContent = msg;
      document.getElementById('successMsg').classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }
    
    function hideMessages() {
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
    }
    
    // Check URL params for default tab
    const params = new URLSearchParams(window.location.search);
    if (params.get('type') === 'employee') {
      switchTab('employee');
    }
  </script>
</body>
</html>
